<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Seminarios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Registro para Seminarios</h1>
        <form id="registroForm" action="{{ url_for('registrar') }}" method="POST">
            <label for="tipo">Tipo:</label>
            <select name="tipo" id="tipo" required>
                <option value="">Selecciona una opción</option>
                <option value="Estudiante">Estudiante</option>
                <option value="Docente">Docente</option>
                <option value="Profesional">Profesional</option>
            </select>
            <span id="tipoError" class="error">Este campo es obligatorio</span>

            <label for="nombres">Nombres:</label>
            <input type="text" name="nombres" id="nombres" required>
            <span id="nombresError" class="error">Este campo es obligatorio</span>

            <label for="apellidos">Apellidos:</label>
            <input type="text" name="apellidos" id="apellidos" required>
            <span id="apellidosError" class="error">Este campo es obligatorio</span>

            <label for="edad">Edad:</label>
            <input type="number" name="edad" id="edad" min="18" required>
            <span id="edadError" class="error">Debes tener al menos 18 años</span>

            <label for="email">Correo electrónico:</label>
            <input type="email" name="email" id="email" required>
            <span id="emailError" class="error">Introduce un correo electrónico válido</span>

            <label for="password">Contraseña:</label>
            <input type="password" name="password" id="password" minlength="6" required>
            <span id="passwordError" class="error">La contraseña debe tener al menos 6 caracteres</span>

            <button type="submit">Registrar</button>
        </form>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function(event) {
            let formIsValid = true;

            // Validar el campo 'Tipo'
            const tipo = document.getElementById('tipo');
            const tipoError = document.getElementById('tipoError');
            if (tipo.value === '') {
                tipoError.style.display = 'block';
                formIsValid = false;
            } else {
                tipoError.style.display = 'none';
            }

            // Validar el campo 'Nombres'
            const nombres = document.getElementById('nombres');
            const nombresError = document.getElementById('nombresError');
            if (nombres.value.trim() === '') {
                nombresError.style.display = 'block';
                formIsValid = false;
            } else {
                nombresError.style.display = 'none';
            }

            // Validar el campo 'Apellidos'
            const apellidos = document.getElementById('apellidos');
            const apellidosError = document.getElementById('apellidosError');
            if (apellidos.value.trim() === '') {
                apellidosError.style.display = 'block';
                formIsValid = false;
            } else {
                apellidosError.style.display = 'none';
            }

            // Validar la 'Edad'
            const edad = document.getElementById('edad');
            const edadError = document.getElementById('edadError');
            if (edad.value < 18) {
                edadError.style.display = 'block';
                formIsValid = false;
            } else {
                edadError.style.display = 'none';
            }

            // Validar el 'Email'
            const email = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!email.value.match(emailPattern)) {
                emailError.style.display = 'block';
                formIsValid = false;
            } else {
                emailError.style.display = 'none';
            }

            // Validar la 'Contraseña'
            const password = document.getElementById('password');
            const passwordError = document.getElementById('passwordError');
            if (password.value.length < 6) {
                passwordError.style.display = 'block';
                formIsValid = false;
            } else {
                passwordError.style.display = 'none';
            }

            if (!formIsValid) {
                event.preventDefault(); // Evita que se envíe el formulario si hay errores
            }
        });
    </script>
</body>
</html>
